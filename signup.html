<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up |Style Loop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<nav class="navbar bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand logo" href="index.html">Style Loop</a>
    <a href="index.html" class="btn btn-outline-dark">Home</a>
  </div>
</nav>

<main class="container auth-container">
  <div class="auth-card">
    <div class="text-center mb-4">
      <p class="eyebrow">JOIN OUR COMMUNITY</p>
      <h1>Create Account</h1>
      <p>Create an account to explore your favourite dresses.</p>
    </div>

    <div id="signupMessage" class="alert d-none" role="alert"></div>
    <form id="signupForm">
      <div class="mb-3">
        <label for="signupName" class="form-label">Full name</label>
        <input type="text" class="form-control" id="signupName" minlength="2" required>
      </div>
      <div class="mb-3">
        <label for="signupEmail" class="form-label">Email address</label>
        <input type="email" class="form-control" id="signupEmail" required>
      </div>
      <div class="mb-3">
        <label for="signupPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="signupPassword" minlength="6" required>
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm password</label>
        <input type="password" class="form-control" id="confirmPassword" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-dark w-100 py-2">Create Account</button>
    </form>

    <p class="text-center mt-4 mb-0">
      Already have an account? <a href="login.html">Login</a>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>setupSignupPage();</script>
</body>
</html>
