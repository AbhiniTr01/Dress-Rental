<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout | Style Loop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand logo" href="index.html">Style Loop</a>
        <a href="cart.html" class="btn btn-outline-dark">Back to Cart</a>
    </div>
</nav>

<main class="container section-space">
    <h1 class="mb-4">Checkout</h1>

    <div class="row g-4">

        <div class="col-md-7">
            <div class="card border-0 shadow-sm p-4">
                <h4 class="mb-3">Customer Details</h4>

                <form id="checkoutForm">
                    <div class="mb-3">
                        <label for="customerName" class="form-label">Full Name</label>
                        <input type="text" id="customerName" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="customerEmail" class="form-label">Email Address</label>
                        <input type="email" id="customerEmail" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="customerPhone" class="form-label">Phone Number</label>
                        <input type="tel" id="customerPhone" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="customerAddress" class="form-label">Delivery Address</label>
                        <textarea id="customerAddress" class="form-control" rows="3" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-dark w-100">
                        Place Order
                    </button>
                </form>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card border-0 shadow-sm p-4">
                <h4>Order Summary</h4>
                <div id="checkoutItems" class="my-3"></div>

                <hr>

                <div class="d-flex justify-content-between">
                    <strong>Total Amount</strong>
                    <strong id="checkoutTotal">₹0</strong>
                </div>
            </div>
        </div>

    </div>
</main>

<script src="script.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    let cart = [];

    try {
        cart = JSON.parse(localStorage.getItem("cart")) || [];
    } catch (error) {
        cart = [];
    }

    const itemsContainer = document.getElementById("checkoutItems");
    const totalElement = document.getElementById("checkoutTotal");

    if (cart.length === 0) {
        itemsContainer.innerHTML = `
            <p>Your cart is empty.</p>
            <a href="collection.html" class="btn btn-outline-dark">
                Browse Collection
            </a>
        `;
        return;
    }

    itemsContainer.innerHTML = cart.map(item => `
        <div class="d-flex justify-content-between gap-3 mb-3">
            <span>${item.name} × ${Number(item.quantity) || 1}</span>
            <span>₹${Number(item.price) * (Number(item.quantity) || 1)}</span>
        </div>
    `).join("");

    const total = cart.reduce((sum, item) => {
        return sum + Number(item.price) * (Number(item.quantity) || 1);
    }, 0);

    totalElement.textContent = "₹" + total;

    document.getElementById("checkoutForm").addEventListener("submit", function (event) {
        event.preventDefault();

        alert("Your details have been entered. Online order processing is not connected yet.");
    });
});
</script>

</body>
</html>
