<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Style Loop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<nav class="navbar bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand logo" href="index.html">Style Loop</a>
    <a href="index.html" class="btn btn-outline-dark">Home</a>
  </div>
</nav>

<main class="container auth-container">
  <div class="auth-card">
    <div class="text-center mb-4">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Login</h1>
      <p>Sign in to continue your fashion journey.</p>
    </div>

    <div id="loginMessage" class="alert d-none" role="alert"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label for="loginEmail" class="form-label">Email address</label>
        <input type="email" class="form-control" id="loginEmail" required>
      </div>
      <div class="mb-3">
        <label for="loginPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="loginPassword" minlength="6" required>
      </div>
      <button class="btn btn-dark w-100 py-2" type="submit">Login</button>
    </form>

    <p class="text-center mt-4 mb-0">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </p>
    <p class="text-center mt-2"><a href="collection.html">Continue shopping</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>setupLoginPage();</script>
</body>
</html>
